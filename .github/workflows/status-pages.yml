name: Publish service status

on:
  push:
    branches: [main]
    paths:
      - 'website/status.html'
      - 'website/status.js'
      - 'scripts/build-status.js'
      - '.github/workflows/status-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-status.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-status

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy standalone status page
        id: deployment
        uses: actions/deploy-pages@v4

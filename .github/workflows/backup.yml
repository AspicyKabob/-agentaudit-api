name: Database Backup

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual backup'
        required: false
        default: 'manual'

jobs:
  backup:
    name: pg_dump → S3
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          FILENAME="agentaudit-backup-${TIMESTAMP}.sql.gz"
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

          # Print the target host (without credentials) for debugging.
          BACKUP_HOST=$(echo "$DATABASE_URL" | sed -E 's|.*@([^/]+)/.*|\1|')
          echo "Dumping from host: $BACKUP_HOST"

          # Run pg_dump inside the matching Postgres 18 image to avoid version mismatch.
          mkdir -p /tmp/backup
          docker run --rm \
            -e DATABASE_URL \
            -e PGSSLMODE \
            -v /tmp/backup:/out \
            postgres:18-alpine \
            sh -c 'pg_dump "$DATABASE_URL" \
              --no-password \
              --format=plain \
              --no-owner \
              --no-privileges \
              --file=/out/backup.sql && chmod 666 /out/backup.sql'

          BACKUP_SIZE=$(stat -c%s "/tmp/backup/backup.sql" 2>/dev/null || stat -f%z "/tmp/backup/backup.sql")
          echo "Plain backup size: ${BACKUP_SIZE} bytes"

          if [ "$BACKUP_SIZE" -lt 1024 ]; then
            echo "ERROR: Backup is suspiciously small (${BACKUP_SIZE} bytes)"
            exit 1
          fi

          gzip -c /tmp/backup/backup.sql > "/tmp/${FILENAME}"
          rm -f /tmp/backup/backup.sql
          BACKUP_SIZE_GZ=$(stat -c%s "/tmp/${FILENAME}" 2>/dev/null || stat -f%z "/tmp/${FILENAME}")
          echo "Gzipped backup size: ${BACKUP_SIZE_GZ} bytes"

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          aws s3 cp "/tmp/${FILENAME}" "s3://${S3_BUCKET}/postgres/${FILENAME}" \
            --storage-class STANDARD_IA
          echo "Uploaded to s3://${S3_BUCKET}/postgres/${FILENAME}"

      - name: Verify upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          aws s3 ls "s3://${S3_BUCKET}/postgres/${FILENAME}"
          echo "Backup verified successfully"

      - name: Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          CUTOFF=$(date -u -d "30 days ago" +"%Y-%m-%dT%H-%M-%SZ" 2>/dev/null || date -u -v-30d +"%Y-%m-%dT%H-%M-%SZ")
          echo "Pruning backups older than: ${CUTOFF}"
          aws s3 ls "s3://${S3_BUCKET}/postgres/" \
            | awk '{print $4}' \
            | while read key; do
                # Extract timestamp from filename (agentaudit-backup-TIMESTAMP.sql.gz)
                FILE_TS=$(echo "$key" | sed 's/agentaudit-backup-//' | sed 's/\.sql\.gz//')
                if [[ "$FILE_TS" < "$CUTOFF" ]]; then
                  echo "Deleting old backup: $key"
                  aws s3 rm "s3://${S3_BUCKET}/postgres/$key"
                fi
              done
          echo "Pruning complete"
